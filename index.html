  <!-- style -->
  <style>
    /* Navbar width: same as on the level select page */
    #topNav {
      width: calc(3 * 110px + 2 * 20px);
      max-width: calc(100% - 24px);
    }

    @media (max-width: 420px) {
      #topNav { width: calc(3 * 84px + 2 * 14px); }
    }

    /* Login button in the navbar: same pill style as the Back button on level select.
       TopNav.css styles every link in the bar as a small icon, so undo that here. */
    #topNav .nav-login-btn {
      display: inline-flex;
      align-items: center;
      width: auto;
      height: auto;
      padding: 4px 14px;
      color: #fff;
      text-decoration: none;
      font-family: Andale Mono, monospace;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 16px;
      background:
        linear-gradient(rebeccapurple, rebeccapurple) padding-box,
        linear-gradient(135deg, #e9d5ff, #a855f7, #f0abfc) border-box;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.45);
      text-shadow: 0 0 6px rgba(240, 171, 252, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #topNav .nav-login-btn:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow:
        0 0 18px rgba(168, 85, 247, 0.7),
        0 0 30px rgba(240, 171, 252, 0.35);
    }
    #topNav .nav-login-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    #image {
      text-align: center;
    }

    #image img {
      width: 80%;
      max-width: 600px;
      height: auto;
    }
  </style>
</head>
