<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">


    <link rel="stylesheet" href="styles/levelStyle.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <!-- Jon's Section Start-->
    <div class="game-wrapper">
        <nav class="level-bar">

            <div class="d-flex gap-2" style="justify-self: end;">

                <a href="level-select.html" class="back-btn" aria-label="Back to level select" title="Back">
                    <i class="bi bi-arrow-left"></i>
                </a>

                <div
                    class="d-flex align-items-center gap-2 bg-white bg-opacity-10 text-white rounded px-3 py-1.5 fw-bold fs-5">
                    <img src="images/star.png" alt="" class="w-6 h-6">
                    <span id="star-count">0</span>/ 3
                </div>

                <button id="char-btn" class="char-btn" aria-label="Change character" title="Character">
                    <i class="bi bi-person-fill"></i>
                </button>
            </div>
        </nav>
        <div id="game-container"></div>
        <div id="char-select" class="inventory-overlay" hidden>
            <div class="inventory-panel" role="dialog" aria-labelledby="char-title">
                <div class="inventory-header">
                    <h2 id="char-title">Choose your character</h2>
                    <button id="close-char" class="close-btn" aria-label="Close character select">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="char-grid" id="char-grid"></div>
            </div>
        </div>

    </div>
    <!-- Jon's Section End -->

    <script src="./src/characters.js"></script>
    <script type="module" src="./src/game.js"></script>
</body>

</html>
