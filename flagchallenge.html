<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flag Challenge</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* border so white edges of flags still show up on white page */
        #flag {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 10px auto;
            border: 1px solid #ccc;
        }

        button {
            display: block;
            width: 100%;
            min-height: 56px;
            margin: 10px 0;
            padding: 14px;
            font-size: 18px;
        }

        /* keep hidden buttons hidden */
        button[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Flag Challenge</h1>
    <p id="info"></p>
    <p>Which country does this flag belong to?</p>
    <img id="flag" alt="Flag to guess" />
    <div id="choices"></div>
    <p id="message"></p>
    <button id="next" hidden>Next</button>

    <script type="module">
        import { db } from "./src/firebaseConfig.js";
        import { collection, getDocs } from "firebase/firestore";
        import { onAuthReady } from "./src/authentication.js";
        const ROUNDS = 5;

        let COUNTRIES = [];

        let round = 0;
        let score = 0;
        let answer;

        const info = document.getElementById("info");
        const flag = document.getElementById("flag");
        const choices = document.getElementById("choices");
        const message = document.getElementById("message");
        const nextBtn = document.getElementById("next");

        async function loadFlags() {
            info.textContent = "Loading flags…";
            try {
                const snapshot = await getDocs(collection(db, "flags"));
                COUNTRIES = snapshot.docs.map((d) => d.data());
                if (COUNTRIES.length < 4) {
                    info.textContent = "Add at least 4 countries to the flags collection in Firestore.";
                    return;
                }
                nextRound();
            } catch (err) {
                console.error(err);
                info.textContent = "Couldn't load the flags from Firestore.";
            }
        }

        function randomCountry() {
            return COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
        }

        function nextRound() {
            // when 5 rounds are done the game restarts
            if (round === ROUNDS) {
                round = 0;
                score = 0;
            }
            round++;
            nextBtn.hidden = true;
            message.textContent = "";
            info.textContent = `Flag ${round} of ${ROUNDS}. Score: ${score}`;

            // Pick random country to show its flag
            answer = randomCountry();
            flag.src = `https://flagcdn.com/w320/${answer.code}.png`;

            // Make a list of 4 different countries, starting with the right answer
            const options = [answer];
            while (options.length < 4) {
                const country = randomCountry();
                if (!options.includes(country)) {
                    options.push(country);
                }
            }

            // Swap the right answer into a random spot so it isn't first every time
            const spot = Math.floor(Math.random() * 4);
            const temp = options[spot];
            options[spot] = options[0];
            options[0] = temp;

            // One button for each option
            choices.innerHTML = "";
            for (const country of options) {
                const btn = document.createElement("button");
                btn.textContent = country.name;
                btn.onclick = function () {
                    guess(country);
                };
                choices.appendChild(btn);
            }
        }

        function guess(country) {
            // Disable the buttons so the player can only answer once
            for (const btn of choices.children) {
                btn.disabled = true;
            }

            if (country === answer) {
                score++;
                message.textContent = "Right!";
            } else {
                message.textContent = `Wrong. That's the flag of ${answer.name}.`;
            }
            info.textContent = `Flag ${round} of ${ROUNDS}. Score: ${score}`;

            if (round === ROUNDS) {
                message.textContent += ` Final score: ${score}/${ROUNDS}.`;
                nextBtn.textContent = "Play again";
            } else {
                nextBtn.textContent = "Next";
            }
            nextBtn.hidden = false;
        }

        nextBtn.onclick = nextRound;
        onAuthReady(function (user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            loadFlags();
        });
    </script>
</body>

</html>
