<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/wordle.css" />
</head>

<body>
    <main class="room">
        <header class="room-header">
            <h1>Word Room</h1>
            <p class="hint">Guess the 4-letter word. You have 6 tries.</p>
        </header>

        <div id="board" class="board" aria-label="Guess board"></div>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>

        <div class="actions">
            <button id="play-again" class="btn" hidden>Play again</button>
            <a id="back-to-map" class="btn btn-quiet" href="level.html">Back to map</a>
        </div>
    </main>

    <script src="./src/wordle.js"></script>
</body>

</html>
