<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Same fonts, background and navbar as the main menu / level select -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/background.css" />
    <link rel="stylesheet" href="styles/TopNav.css" />
    <link rel="stylesheet" href="styles/loginStyle.css" />
  </head>
  <body>
    <!-- Animated background layer (sits behind everything) -->
    <div class="bg" aria-hidden="true">
      <div class="blob one"></div>
      <div class="blob two"></div>
      <div class="blob three"></div>
      <div class="blob four"></div>
    </div>

    <!-- Navbar: Back on the left, like level select -->
    <nav id="topNav">
      <a href="index.html" class="back-btn"><span class="arrow">←</span> Back</a>
    </nav>

    <main class="auth-page">
      <div class="auth-card">
        <!-- Alerts -->
        <div id="authAlert" class="auth-alert d-none" role="alert"></div>

        <!-- Login -->
        <div id="loginView">
          <h1 class="auth-title">Login</h1>
          <form id="loginForm" class="auth-form" novalidate>
            <input
              type="email"
              id="loginEmail"
              class="auth-input"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              required
            />
            <input
              type="password"
              id="loginPassword"
              class="auth-input"
              placeholder="Password"
              aria-label="Password"
              autocomplete="current-password"
              required
            />
            <button type="submit" class="confirmButton">LOGIN</button>
          </form>
          <p class="switchText">
            Don’t have an account?
            <a href="#" id="toSignup">Sign up</a>
          </p>
        </div>

        <!-- Signup -->
        <div id="signupView" class="d-none">
          <h1 class="auth-title">Sign Up</h1>
          <form id="signupForm" class="auth-form" novalidate>
            <input
              type="text"
              id="signupName"
              class="auth-input"
              placeholder="First and Last Name"
              aria-label="Full name"
              autocomplete="name"
              required
            />
            <input
              type="email"
              id="signupEmail"
              class="auth-input"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              required
            />
            <input
              type="password"
              id="signupPassword"
              class="auth-input"
              placeholder="Password"
              aria-label="Password"
              autocomplete="new-password"
              required
            />
            <button type="submit" class="confirmButton">CREATE ACCOUNT</button>
          </form>
          <p class="switchText">
            Already have an account?
            <a href="#" id="toLogin">Login</a>
          </p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/app.js"></script>

    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
  </body>
</html>
