<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        html,
        body {
            background-color: #333334;
        }

        canvas {
            border: 1px solid #060606;
            background-color: #2b2b2c;
        }
    </style>

    <link rel="stylesheet" href="styles/style.css" />

</head>

<body onload="startGame()">

    <!-- Jon's Section Start-->
    <nav class="navbar px-3 py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="#" class="text-white fs-1">
                <i class="bi bi-person-circle"></i>
            </a>

            <div
                class="d-flex align-items-center gap-2 bg-white bg-opacity-10 text-white rounded px-3 py-1 fw-bold fs-5">
                <i class="bi bi-hexagon-fill"></i>
                23820
            </div>

            <a href="#" class="text-white fs-2">
                <i class="bi bi-gear-fill"></i>
            </a>
        </div>
    </nav>
    <!-- Jon's Section End -->

    <div id="game-container" class="d-flex justify-content-center"></div>

    <script>

        var testSprite

        function startGame() {
            gameArea.start();
            testSprite = new component(50, 50, "red", 100, 100)
        }

        var gameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.canvas.width = 380;
                this.canvas.height = 600;
                //this.canvas.style.cursor = "none"; //cursor movement
                this.context = this.canvas.getContext("2d");
                document.getElementById("game-container").appendChild(this.canvas);
                this.interval = setInterval(updateGameArea, 20);
                /*
                window.addEventListener('touchmove', function (e) {
                    gameArea.x = e.touches[0].screenX;
                    gameArea.y = e.touches[0].screenY;
                }) */

                 // keyboard movement
                window.addEventListener('keydown', function (e) {
                    gameArea.key = e.keyCode;
                })
                window.addEventListener('keyup', function (e) {
                    gameArea.key = false;
                })
                
            },

            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function setTouchPos(e) {
            var rect = gameArea.canvas.getBoundingClientRect();
            var scaleX = gameArea.canvas.width / rect.width;
            var scaleY = gameArea.canvas.height / rect.height;
            gameArea.x = (e.touches[0].clientX - rect.left) * scaleX;
            gameArea.y = (e.touches[0].clientY - rect.top) * scaleY;
        }

        gameArea.canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            setTouchPos(e);
        }, { passive: false });

        gameArea.canvas.addEventListener('touchmove', function (e) {
            e.preventDefault();
            setTouchPos(e);
        }, { passive: false });

        function component(width, height, colour, x, y) {
            this.width = width;
            this.height = height;
            this.speedX = 0;
            this.speedY = 0;
            this.x = x;
            this.y = y;
            this.update = function () {
                ctx = gameArea.context;
                ctx.fillStyle = colour;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            this.newPos = function () {
                this.x += this.speedX;
                this.y += this.speedY;
            }
        }

        /*
        function updateGameArea() {
            gameArea.clear();
            if (gameArea.x && gameArea.y) {
                testSprite.x = gameArea.x;
                testSprite.y = gameArea.y;
            }
            testSprite.update();
        }

        */
        //Keyboard movement
        function updateGameArea() {
            gameArea.clear();
            testSprite.newPos();
            testSprite.update();
        }

        function updateGameArea() {
            gameArea.clear();
            testSprite.speedX = 0;
            testSprite.speedY = 0;
            if (gameArea.key && gameArea.key == 37) { testSprite.speedX = -1; }
            if (gameArea.key && gameArea.key == 39) { testSprite.speedX = 1; }
            if (gameArea.key && gameArea.key == 38) { testSprite.speedY = -1; }
            if (gameArea.key && gameArea.key == 40) { testSprite.speedY = 1; }
            testSprite.newPos();
            testSprite.update();
        }
        

        /* Button Movement
            function moveUp() {
                testSprite.speedY -= 1;
            }
    
            function moveDown() {
                testSprite.speedY += 1;
            }
    
            function moveLeft() {
                testSprite.speedX -= 1;
            }
    
            function moveRight() {
                testSprite.speedX += 1;
            }
    
            function stopMove() {
                testSprite.speedX = 0;
                testSprite.speedY = 0;
            }
    
        */
    </script>

    <!-- buttons -->
    <!-- <button onclick="moveUp()">UP</button>

    <button onclick="moveLeft()">LEFT</button>
    <button onclick="moveRight()">RIGHT</button> -->
</body>

</html>
