<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        html,
        body {
            background-color: #333334;
        }

        canvas {
            border: 1px solid #060606;
            background-color: #2b2b2c;
        }

        .game-wrapper {
            width: fit-content;
            margin: 20px auto;
            position: relative;
        }

        .level-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 8px 10px;
            background-color: #2b2b2c;
            border: 1px solid #060606;
            border-bottom: none;
        }

        #game-container canvas {
            display: block;
        }

        .back-btn {
            justify-self: start;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .back-btn:focus-visible {
            outline: 2px solid #fff;
        }

        .inventory-btn {
            justify-self: end;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .inventory-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .inventory-btn:focus-visible {
            outline: 2px solid #fff;
        }
                .inventory-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inventory-overlay[hidden] {
            display: none;
        }

        .inventory-panel {
            width: 90%;
            padding: 16px;
            background: #2b2b2c;
            border: 1px solid #060606;
            border-radius: 12px;
            color: #fff;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
    </style>

    <link rel="stylesheet" href="styles/style.css" />

</head>

<body onload="startGame()">

    <!-- Jon's Section Start-->
    <div class="game-wrapper">
        <nav class="level-bar">

            <a href="level-select.html" class="back-btn" aria-label="Back to level select" title="Back">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div
                class="d-flex align-items-center gap-2 bg-white bg-opacity-10 text-white rounded px-3 py-1 fw-bold fs-5">
                <i class="bi bi-hexagon-fill"></i>
                23820
            </div>

            <button class="inventory-btn" aria-label="Inventory" title="Inventory">
                <svg viewBox="0 0 64 64" width="30" height="30">
                    <defs>
                        <g id="sword" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
                            <polygon points="32,4 37,11 37,40 27,40 27,11" fill="#dfe6ee" />
                            <line x1="32" y1="10" x2="32" y2="37" stroke="#ffffff" stroke-width="2"
                                stroke-linecap="round" />
                            <rect x="21" y="40" width="22" height="6" rx="3" fill="#f2c230" />
                            <rect x="29" y="46" width="6" height="10" rx="2" fill="#8b5a2b" />
                            <circle cx="32" cy="58" r="4" fill="#f2c230" />
                        </g>
                    </defs>
                    <use href="#sword" transform="rotate(-40 32 32)" />
                    <use href="#sword" transform="rotate(40 32 32)" />
                </svg>
            </button>
        </nav>

        <div id="game-container"></div>
                <div id="inventory" class="inventory-overlay" hidden>
                    <div class="inventory-panel" role="dialog" aria-labelledby="inventory-title">
                        <div class="inventory-header">
                            <h2 id="inventory-title">Inventory</h2>
                            <button id="close-inventory" class="close-btn" aria-label="Close inventory">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="inventory-grid" id="inventory-grid"></div>
                    </div>
                </div>

    </div>
    <!-- Jon's Section End -->

    <script>

        var testSprite

        function startGame() {
            gameArea.start();
            testSprite = new component(50, 50, "red", 100, 100)
        }

        var gameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.canvas.width = 380;
                this.canvas.height = 600;
                //this.canvas.style.cursor = "none"; //cursor movement
                this.context = this.canvas.getContext("2d");
                document.getElementById("game-container").appendChild(this.canvas);
                this.interval = setInterval(updateGameArea, 20);
                /*
                window.addEventListener('touchmove', function (e) {
                    gameArea.x = e.touches[0].screenX;
                    gameArea.y = e.touches[0].screenY;
                }) */

                // keyboard movement
                window.addEventListener('keydown', function (e) {
                    gameArea.key = e.keyCode;
                })
                window.addEventListener('keyup', function (e) {
                    gameArea.key = false;
                })

            },

            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function setTouchPos(e) {
            var rect = gameArea.canvas.getBoundingClientRect();
            var scaleX = gameArea.canvas.width / rect.width;
            var scaleY = gameArea.canvas.height / rect.height;
            gameArea.x = (e.touches[0].clientX - rect.left) * scaleX;
            gameArea.y = (e.touches[0].clientY - rect.top) * scaleY;
        }

        gameArea.canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            setTouchPos(e);
        }, { passive: false });

        gameArea.canvas.addEventListener('touchmove', function (e) {
            e.preventDefault();
            setTouchPos(e);
        }, { passive: false });

        function component(width, height, colour, x, y) {
            this.width = width;
            this.height = height;
            this.speedX = 0;
            this.speedY = 0;
            this.x = x;
            this.y = y;
            this.update = function () {
                ctx = gameArea.context;
                ctx.fillStyle = colour;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            this.newPos = function () {
                this.x += this.speedX;
                this.y += this.speedY;
            }
        }

        /*
        function updateGameArea() {
            gameArea.clear();
            if (gameArea.x && gameArea.y) {
                testSprite.x = gameArea.x;
                testSprite.y = gameArea.y;
            }
            testSprite.update();
        }

        */
        //Keyboard movement
        function updateGameArea() {
            gameArea.clear();
            testSprite.newPos();
            testSprite.update();
        }

        function updateGameArea() {
            gameArea.clear();
            testSprite.speedX = 0;
            testSprite.speedY = 0;
            if (gameArea.key && gameArea.key == 37) { testSprite.speedX = -4; }
            if (gameArea.key && gameArea.key == 39) { testSprite.speedX = 4; }
            if (gameArea.key && gameArea.key == 38) { testSprite.speedY = -4; }
            if (gameArea.key && gameArea.key == 40) { testSprite.speedY = 4; }
            testSprite.newPos();
            testSprite.update();
        }


        /* Button Movement
            function moveUp() {
                testSprite.speedY -= 1;
            }
    
            function moveDown() {
                testSprite.speedY += 1;
            }
    
            function moveLeft() {
                testSprite.speedX -= 1;
            }
    
            function moveRight() {
                testSprite.speedX += 1;
            }
    
            function stopMove() {
                testSprite.speedX = 0;
                testSprite.speedY = 0;
            }
    
        */

                // ---------- Inventory ----------
                    const inventory = document.getElementById("inventory");
                    const inventoryGrid = document.getElementById("inventory-grid");
                    const SLOT_COUNT = 12;

                    for (let i = 0; i < SLOT_COUNT; i++) {
                        const slot = document.createElement("div");
                        slot.className = "inventory-slot";
                        inventoryGrid.appendChild(slot);
                    }

                    function openInventory() {
                        if (!inventory.hidden) return;
                        inventory.hidden = false;
                        clearInterval(gameArea.interval);   // pause the game
                        gameArea.key = false;               // stop any held movement
                    }

                    function closeInventory() {
                        if (inventory.hidden) return;
                        inventory.hidden = true;
                        gameArea.interval = setInterval(updateGameArea, 20); // resume
                    }

                    document.querySelector(".inventory-btn").addEventListener("click", openInventory);
                    document.getElementById("close-inventory").addEventListener("click", closeInventory);

                    window.addEventListener("keydown", (e) => {
                        if (e.key === "Escape") closeInventory();
                    });
    </script>

    <!-- buttons -->
    <!-- <button onclick="moveUp()">UP</button>
    <button onclick="moveDown()">DOWN</button>
    <button onclick="moveLeft()">LEFT</button>
    <button onclick="moveRight()">RIGHT</button> -->
</body>

</html>
