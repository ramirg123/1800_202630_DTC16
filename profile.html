<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>

    <!-- Same fonts, background and navbar as the main menu / level select -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles/background.css" />
    <link rel="stylesheet" href="styles/TopNav.css" />
    <link rel="stylesheet" href="styles/profileStyle.css" />
  </head>
  <body>
    <!-- Animated background layer (sits behind everything) -->
    <div class="bg" aria-hidden="true">
      <div class="blob one"></div>
      <div class="blob two"></div>
      <div class="blob three"></div>
      <div class="blob four"></div>
    </div>

    <!-- Navbar: Back on the left, the player's character on the right -->
    <nav id="topNav">
      <a href="index.html" class="back-btn" id="backBtn"><span class="arrow">←</span> Back</a>

      <button type="button" class="navItem" id="profileNav" aria-label="Profile">
        <i class="bi bi-person-circle"></i>
      </button>
    </nav>

    <main class="profile-page">
      <h1 class="profile-title" id="profile-title">Profile</h1>

      <section class="profile-card" aria-labelledby="char-heading">
        <p class="profile-greeting" id="greeting">Loading…</p>

        <!-- Current character -->
        <div class="current-char">
          <canvas id="current-preview" width="96" height="96" aria-hidden="true"></canvas>
          <span id="current-name">No character yet</span>
        </div>

        <h2 class="section-heading" id="char-heading">Choose your character</h2>
        <div class="char-grid" id="char-grid"></div>

        <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
      </section>

      <!-- Only shown right after sign up / login (profile.html?setup=1) -->
      <a href="main.html" class="continue-btn" id="continueBtn" hidden aria-disabled="true">Continue</a>
    </main>

    <script src="src/characters.js"></script>
    <script type="module" src="src/profile.js"></script>
  </body>
</html>
