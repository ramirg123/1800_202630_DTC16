<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Level</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      /* Same purple glow + dark corners as the main menu */
      background: radial-gradient(ellipse at center, #5a2a86 0%, #4a2272 45%, #1a0620 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top bar: back button on the left, coins in the middle */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    /* Back button: same theme as PLAY / ACHIEVEMENTS / SHOP */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      color: #fff;
      text-decoration: none;
      font-family: Andale Mono, monospace;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 16px;
      background:
        linear-gradient(rebeccapurple, rebeccapurple) padding-box,
        linear-gradient(135deg, #e9d5ff, #a855f7, #f0abfc) border-box;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.45);
      text-shadow: 0 0 6px rgba(240, 171, 252, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .back-btn:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow:
        0 0 18px rgba(168, 85, 247, 0.7),
        0 0 30px rgba(240, 171, 252, 0.35);
    }
    .back-btn .arrow { transition: transform 0.2s ease; }
    .back-btn:hover .arrow { transform: translateX(-3px); }

    .coins {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
    }

    .spacer { width: 80px; } /* balances the back button so coins stay centred */

    h1 {
      font-family: "Audiowide", system-ui, sans-serif;
      font-size: clamp(32px, 6vw, 56px);
      margin: 32px 0 40px;
      text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      gap: 20px;
    }

    .level-btn {
      height: 110px;
      border: none;
      border-radius: 20px;
      background: #6a35a3;
      color: #fff;
      font-family: "Audiowide", system-ui, sans-serif;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 6px 0 #3b1a5e;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .level-btn:hover { background: #7d44bd; }
    .level-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3b1a5e; }
    .level-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .level-btn.locked {
      position: relative;
      background: #3a1d55;
      color: rgba(255, 255, 255, 0.35);   /* faded level number */
      cursor: not-allowed;
      box-shadow: 0 6px 0 #24103a;
    }
    .level-btn.locked:hover { background: #3a1d55; }
    .level-btn.locked:active { transform: none; }

    /* Plain white lock in the top-right corner of locked tiles */
    .lock-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 22px;
      height: 22px;
    }

    @media (max-width: 420px) {
      .level-grid { grid-template-columns: repeat(3, 84px); gap: 14px; }
      .level-btn { height: 84px; font-size: 30px; }
      .lock-icon { top: 7px; right: 7px; width: 17px; height: 17px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn"><span class="arrow">←</span> Back</a>
    <div class="coins">⬢ <span id="coin-count">0</span></div>
    <div class="spacer"></div>
  </div>

  <h1>Select Level</h1>

  <div class="level-grid" id="level-grid"></div>

  <script type="module">
    import { LEVELS } from "./src/levels.js";

    const TOTAL_SLOTS = 9;                          // tiles shown on the page
    const AVAILABLE = Object.keys(LEVELS).length;   // levels that actually exist

    //TEMPORARY!! TODO: load unlockedLevel from Firestore instead (everything unlocked for testing)
    let unlocked = AVAILABLE;

    // Plain white padlock icon
    const LOCK_SVG = `
      <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.5 11V7.5a4.5 4.5 0 0 1 9 0V11" fill="none" stroke="#fff"
              stroke-width="2.4" stroke-linecap="round"/>
        <rect x="4.5" y="10.5" width="15" height="11" rx="2.5" fill="#fff"/>
      </svg>`;

    const grid = document.getElementById("level-grid");
 // Show everything locked until Firestore answers


    for (let i = 1; i <= TOTAL_SLOTS; i++) {
      const btn = document.createElement("button");
      btn.className = "level-btn";

      // Playable only if the level exists AND the player has unlocked it
      if (i <= AVAILABLE && i <= unlocked) {
        btn.textContent = i;
        btn.setAttribute("aria-label", "Play level " + i);
        // level.html can read this with: new URLSearchParams(location.search).get("level")
        btn.addEventListener("click", () => {
          window.location.href = "level.html?level=" + i;
        });
      } else {
        btn.innerHTML = i + LOCK_SVG;   // level number + white lock
        btn.classList.add("locked");
        btn.disabled = true;
        btn.setAttribute("aria-label", "Level " + i + " is locked");
      }

      grid.appendChild(btn);
    }
  </script>
</body>
</html>
