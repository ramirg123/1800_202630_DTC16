<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Level</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      /* Same purple glow + dark corners as the main menu */
      background: radial-gradient(ellipse at center, #5a2a86 0%, #4a2272 45%, #1a0620 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top bar: back button on the left, coins in the middle */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    .back-btn {
      background: #6a35a3;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .back-btn:hover { background: #7d44bd; }

    .coins {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
    }

    .spacer { width: 80px; } /* balances the back button so coins stay centred */

    h1 {
      font-family: "Audiowide", system-ui, sans-serif;
      font-size: clamp(32px, 6vw, 56px);
      margin: 32px 0 40px;
      text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      gap: 20px;
    }

    .level-btn {
      height: 110px;
      border: none;
      border-radius: 20px;
      background: #6a35a3;
      color: #fff;
      font-family: "Audiowide", system-ui, sans-serif;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 6px 0 #3b1a5e;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .level-btn:hover { background: #7d44bd; }
    .level-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3b1a5e; }
    .level-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .level-btn.locked {
      background: #3a1d55;
      color: rgba(255, 255, 255, 0.35);
      cursor: not-allowed;
      box-shadow: 0 6px 0 #24103a;
    }
    .level-btn.locked:active { transform: none; }

    @media (max-width: 420px) {
      .level-grid { grid-template-columns: repeat(3, 84px); gap: 14px; }
      .level-btn { height: 84px; font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="main.html" class="back-btn">Back</a>
    <div class="coins">⬢ <span id="coin-count">0</span></div>
    <div class="spacer"></div>
  </div>

  <h1>Select Level</h1>

  <div class="level-grid" id="level-grid"></div>

  <script>
    const TOTAL_LEVELS = 9;

    // Highest level the player has unlocked. Defaults to 1 until your
    // game saves progress (e.g. localStorage.setItem("unlockedLevel", 2)).
    let unlocked = 1;
    try {
      unlocked = parseInt(localStorage.getItem("unlockedLevel")) || 1;
    } catch (e) {}

    const grid = document.getElementById("level-grid");

    for (let i = 1; i <= TOTAL_LEVELS; i++) {
      const btn = document.createElement("button");
      btn.className = "level-btn";

      if (i <= unlocked) {
        btn.textContent = i;
        btn.setAttribute("aria-label", "Play level " + i);
        // level.html can read this with: new URLSearchParams(location.search).get("level")
        btn.addEventListener("click", () => {
          window.location.href = "level.html?level=" + i;
        });
      } else {
        btn.textContent = "🔒";
        btn.classList.add("locked");
        btn.disabled = true;
        btn.setAttribute("aria-label", "Level " + i + " is locked");
      }

      grid.appendChild(btn);
    }
  </script>
</body>
</html>
