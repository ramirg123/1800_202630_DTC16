<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Street View Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        #pano {
            width: 100%;
            height: 450px;
            background: #ddd;
        }

        button {
            padding: 8px 12px;
            margin: 4px;
        }
    </style>
</head>

<body>
    <h1>Guess the continent</h1>
    <p id="info">Loading…</p>
    <div id="pano"></div>
    <div id="choices"></div>
    <p id="message"></p>
    <button id="next" hidden>Next</button>

    <script>
        const ROUNDS = 5;
        const SEEDS = {
            "Africa": [[-1.29, 36.82, "Nairobi, Kenya"], [5.60, -0.19, "Accra, Ghana"], [14.69, -17.44, "Dakar, Senegal"], [-26.20, 28.04, "Johannesburg, South Africa"], [-33.92, 18.42, "Cape Town, South Africa"], [0.35, 32.58, "Kampala, Uganda"]],
            "Asia": [[35.68, 139.69, "Tokyo, Japan"], [37.57, 126.98, "Seoul, South Korea"], [13.76, 100.50, "Bangkok, Thailand"], [3.14, 101.69, "Kuala Lumpur, Malaysia"], [14.60, 120.98, "Manila, Philippines"], [28.61, 77.21, "Delhi, India"]],
            "Europe": [[51.51, -0.13, "London, UK"], [48.86, 2.35, "Paris, France"], [52.52, 13.40, "Berlin, Germany"], [40.42, -3.70, "Madrid, Spain"], [41.90, 12.50, "Rome, Italy"], [59.33, 18.07, "Stockholm, Sweden"]],
            "North America": [[49.28, -123.12, "Vancouver, Canada"], [43.65, -79.38, "Toronto, Canada"], [40.71, -74.01, "New York, USA"], [39.74, -104.99, "Denver, USA"], [19.43, -99.13, "Mexico City, Mexico"], [9.93, -84.08, "San José, Costa Rica"]],
            "South America": [[4.71, -74.07, "Bogotá, Colombia"], [-12.05, -77.04, "Lima, Peru"], [-33.45, -70.67, "Santiago, Chile"], [-34.60, -58.38, "Buenos Aires, Argentina"], [-23.55, -46.63, "São Paulo, Brazil"], [-22.91, -43.17, "Rio de Janeiro, Brazil"]],
            "Oceania": [[-33.87, 151.21, "Sydney, Australia"], [-37.81, 144.96, "Melbourne, Australia"], [-27.47, 153.03, "Brisbane, Australia"], [-31.95, 115.86, "Perth, Australia"], [-36.85, 174.76, "Auckland, New Zealand"], [-41.29, 174.78, "Wellington, New Zealand"]],
        };
        const CONTINENTS = Object.keys(SEEDS);

        let panorama, service, answer;
        let round = 0, score = 0, canGuess = false;

        const info = document.getElementById("info");
        const message = document.getElementById("message");
        const nextBtn = document.getElementById("next");

        function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

        // Google calls this when the API key is rejected
        window.gm_authFailure = () => { info.textContent = "API key problem. Check the key and its website restrictions."; };

        // Google calls this when the Maps script has loaded
        function initGame() {
            service = new google.maps.StreetViewService();
            panorama = new google.maps.StreetViewPanorama(document.getElementById("pano"), {
                addressControl: false,
                showRoadLabels: false,
            });

            for (const name of CONTINENTS) {
                const btn = document.createElement("button");
                btn.textContent = name;
                btn.onclick = () => guess(name);
                document.getElementById("choices").appendChild(btn);
            }
            nextBtn.onclick = nextRound;
            nextRound();
        }

        async function nextRound() {
            if (round === ROUNDS) { round = 0; score = 0; }   // play again
            round++;
            nextBtn.hidden = true;
            message.textContent = "";
            info.textContent = `Round ${round} of ${ROUNDS}. Score: ${score}. Finding a spot…`;

            for (let tries = 0; tries < 10; tries++) {
                const continent = pick(CONTINENTS);
                const [lat, lng, place] = pick(SEEDS[continent]);
                const location = { lat: lat + (Math.random() - 0.5), lng: lng + (Math.random() - 0.5) };
                try {
                    const { data } = await service.getPanorama({ location, radius: 50000 });
                    panorama.setPano(data.location.pano);
                    panorama.setPov({ heading: Math.random() * 360, pitch: 0 });
                    answer = { continent, place };
                    info.textContent = `Round ${round} of ${ROUNDS}. Score: ${score}`;
                    canGuess = true;
                    return;
                } catch (err) {
                    console.warn("No Street View near", place, err);   // shows the real reason in the Console
                }
            }
            info.textContent = "Couldn't find a Street View spot. Check the Console (Ctrl+Shift+J).";
            round--;
            nextBtn.textContent = "Try again";
            nextBtn.hidden = false;
        }

        function guess(name) {
            if (!canGuess) return;
            canGuess = false;
            const right = name === answer.continent;
            if (right) score++;
            message.textContent = `${right ? "Right!" : "Wrong."} It was ${answer.continent} (around ${answer.place}).`;
            info.textContent = `Round ${round} of ${ROUNDS}. Score: ${score}`;

            if (round === ROUNDS) {
                message.textContent += ` Final score: ${score}/${ROUNDS}.`;
                nextBtn.textContent = "Play again";
            } else {
                nextBtn.textContent = "Next";
            }
            nextBtn.hidden = false;
        }
    </script>

    <!-- Replace YOUR_API_KEY with your Google Maps key -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCbZFLZ60TutNIr2gCaD0d4uzDtWehMvxw&callback=initGame"></script>
</body>

</html>
